<style>
:root{color-scheme:dark;font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;color:#eeeae0;background:#111615}*{box-sizing:border-box}body{margin:0}main{max-width:1620px;margin:auto;padding:20px clamp(12px,3.2vw,46px) 34px}header,.row,figcaption,.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:14px}h1{margin:0;font:650 clamp(26px,3vw,43px)/1.2 Georgia,"SimSun",serif}header p{margin:5px 0 0;color:#b7c3b8}button,select{font:inherit;color:#eae9df;border:1px solid #48574e;background:#202a24;padding:5px 11px;border-radius:5px;cursor:pointer}button:hover,select:hover{border-color:#b2c6aa}button[aria-pressed=true],#play{background:#dde7ce;color:#202b20;border-color:#dde7ce}button:disabled{opacity:.4;cursor:default}figure{margin:0;min-width:0}.panes{display:grid;gap:14px}.panes.compare{grid-template-columns:repeat(2,minmax(0,1fr))}figcaption{font-size:14px;justify-content:space-between;margin-bottom:5px;color:#d5dbd0}.surface{width:100%;aspect-ratio:12/5;background:#060908;border:1px solid #39433b;position:relative}.surface>*{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}.controls{margin-top:12px;display:grid;gap:10px}.bar{flex-wrap:nowrap}.bar input{min-width:55px;flex:1;accent-color:#b7d0a6}.meter{font:13px Consolas,monospace;white-space:nowrap;color:#bed2bb}.row{gap:8px}.rule{margin:0;color:#c7cdbf}.info{font-size:14px;color:#c8d4c7;border-top:1px solid #36453a;padding-top:9px}a{color:#b6dfc1}.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.refs img{width:100%;height:115px;object-fit:contain;background:#090d0b}.refs p{margin:1px 0;color:#c6d0c2;font-size:13px}details{margin-top:15px}summary{cursor:pointer;margin-bottom:8px}label{white-space:nowrap}[hidden]{display:none!important}@media(max-width:820px){.panes.compare{grid-template-columns:1fr}main{padding:10px}header{gap:12px}.bar{gap:5px}}
</style>

<main>
 <header><div><h1 id="heading">万剑归宗</h1><p id="identity"></p></div><nav class="row" aria-label="选择特效"><button data-tab="current">万剑归宗</button><button data-tab="fate">无限剑制 · Fate</button><button data-tab="rain">万剑诀 · 剑雨</button></nav></header>

 </div>
