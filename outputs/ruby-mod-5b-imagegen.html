  const origin = performance.now() - rows[frame].start_ms / speed;
  const last = rows.at(-1);
  const end = last.start_ms + last.duration_ms;
  controls.play.textContent = '暂停';
  function update(now) {
    const total = (now - origin) * speed;
    const elapsed = controls.loop.checked ? total % (end + 300) : total;
    const current = rows.findLastIndex(row => row.start_ms <= elapsed);
    if (current !== frame) show(current);
    if (!controls.loop.checked && elapsed >= end) pause();
    else animation = requestAnimationFrame(update);
  }
  animation = requestAnimationFrame(update);
};
controls.previous.onclick = () => { pause(); show(frame - 1); };
controls.next.onclick = () => { pause(); show(frame + 1); };
controls.seek.oninput = () => { pause(); show(Number(controls.seek.value)); };
controls.timing.onchange = () => { pause(); show(frame); };
controls.speed.onchange = pause;
show(0);
</script>
</html>
