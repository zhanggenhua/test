<script>
(async () => {
  const data = JSON.parse(document.querySelector('#art').textContent);
  const el = id => document.getElementById(id);
  const keys = Object.keys(data.styles);
  const stages = keys.map(key => el(key).getContext('2d'));
  const beam = document.createElement('canvas');
  beam.width = stages[0].canvas.width;
  beam.height = stages[0].canvas.height;
  const body = beam.getContext('2d');
  const texture = new Image();
  texture.src = data.atlas.src;
  await texture.decode();
  const {charge, release, shrink, clear, end} = data.timeline;
  let time = 437, playing = false, previous = 0;
  el('time').max = end;
  const steps = [...new Set([0, charge, release, shrink, clear, end, ...data.events.map(e=>e.time_ms),
    ...Array.from({length: 5}, (_, i) => charge + i * 33),
    ...Array.from({length: 14}, (_, i) => release + i * 33)])].sort((a,b) => a-b);
  const clamp = (low, n, high) => Math.min(high, Math.max(low, n));
  const smooth = t => t*t*(3-2*t);
  function cell(ctx, id, x, y, scale=1, heightScale=1) {
    if (id < 0) return;
    const [u,v,w,h,ox,oy] = data.atlas.cells[id];
    ctx.drawImage(texture,u,v,w,h,x+ox*scale,y+oy*scale*heightScale,w*scale,h*scale*heightScale);
  }
  function drawPart(ctx, track, elapsed, x, y, heightScale=1, size=1) {
    const at = elapsed % track.duration;
    const i = track.marks.findLastIndex(t => t <= at);
    const scale = track.scale * size;
    cell(ctx, track.cells[i], x-track.pivot[0]*scale, y-track.pivot[1]*scale*heightScale, scale, heightScale);
  }
  function drawBeam(ctx, set, elapsed, releaseAge, x, y, span, hitting) {
    const power = 1 - smooth(clamp(0, (elapsed - (shrink-release))/(clear-shrink), 1));
    const open = smooth(clamp(0, (elapsed+8)/94, 1));
    const front = x + span * open;
    const beamWidth = Math.max(0, front-x);
    const cap = Math.min(hitting ? 4 : 34, beamWidth);
    body.clearRect(0,0,beam.width,beam.height);
    if (beamWidth > 0) {
      drawPart(body,set.body,elapsed,x,y,(.62 + .38*open) * (.22 + .78*power));
      body.clearRect(0,0,x,beam.height);
      body.clearRect(front,0,beam.width-front,beam.height);
      const fade = body.createLinearGradient(front-cap,0,front,0);
      fade.addColorStop(0,'transparent');
      fade.addColorStop(.5,hitting ? 'transparent' : 'rgba(0,0,0,.39)');
      fade.addColorStop(1,'#000');
      body.save();
      body.globalCompositeOperation = 'destination-out';
      body.fillStyle = fade;
      body.fillRect(front-cap,0,cap+.5,beam.height);
      body.restore();
    }
    ctx.save();
    ctx.globalAlpha = power;
    ctx.drawImage(beam,0,0);
    drawPart(ctx,set.emitter,elapsed,x,y,1,.85 + .15*power + .28*Math.max(0,1-elapsed/65));
    if (hitting) drawPart(ctx,set.impact,releaseAge,front,y,1,.84 + .16*power);
    ctx.restore();
  }
  function paint() {
    const t = Math.floor(Math.min(end,time));
    const pose = data.events.findLast(row => row.time_ms <= t);
    const aimed = Number(el('range').value);
    const span = el('moving').checked
      ? clamp(100, Math.round(aimed + 68*Math.sin((t-release)*.02)),440)
      : aimed;
    const hit = el('hit').checked && t >= release+94;
    for (let i=0;i<stages.length;i++) {
      const ctx = stages[i], art = data.styles[keys[i]];
      ctx.fillStyle = el('stage').value;
      ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);
      if (!el('solo').checked) cell(ctx,data.body[pose.body],0,0);
      if (t >= charge && t < release) {
        const [x,y] = data.palms[pose.body];
        const progress = smooth((t-charge)/(release-charge));
        ctx.save();
        ctx.globalAlpha = .32 + .68*progress;
        drawPart(ctx,art.charge,Math.round((t-charge)*2.2),x,y,1,.57 + .43*progress);
        ctx.restore();
      }
      if (t >= release && t < clear) {
        const [x,y] = data.palms['normal-fire'];
        drawBeam(ctx,art,t-release,t-release-94,x,y,span,hit);
      }
    }
    el('time').value = t;
    el('distance').textContent = span + ' px';
    el('phase').textContent = t + ' ms · ' + (t<charge ? '预备' : t<release ? '蓄气' : t<shrink ? '出波' : t<clear ? '收束' : '结束');
  }
  function setPlaying(active) {
    playing = active;
    el('play').textContent = playing ? '暂停' : '播放';
  }
  function seek(t) { setPlaying(false); time = t; paint(); }
  el('play').onclick = () => {
    if (!playing && time >= end) time = 0;
    setPlaying(!playing);
    paint();
  };
  el('prev').onclick = () => seek(steps.findLast(t => t < time) ?? 0);
  el('next').onclick = () => seek(steps.find(t => t > time) ?? end);
  el('time').oninput = e => seek(Number(e.target.value));
  for (const id of ['range','hit','moving','solo','stage']) el(id).oninput = paint;
  function tick(now) {
    if (playing && previous) {
      time += Math.min(50,now-previous) * Number(el('rate').value);
      if (time >= end+360) time = 0;
      paint();
    }
    previous = now;
    requestAnimationFrame(tick);
  }
  paint();
  document.body.dataset.ready = 'true';
  requestAnimationFrame(tick);
})().catch(error => {document.body.dataset.ready = 'error'; console.error(error);});
</script>
