<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>龙珠特效 · 原片对照</title>
<style>
:root{color-scheme:dark;font:15px "Microsoft YaHei",system-ui,sans-serif;color:#e6eff2;background:#10191c;--line:#33444a;--soft:#b1c2c8;--mint:#a7f1d9}
*{box-sizing:border-box}body{margin:0}main{max-width:1680px;margin:auto;padding:clamp(12px,2vw,30px)}header,.bar,.transport,.cards,nav,.stamps{display:flex;align-items:center;flex-wrap:wrap;gap:10px}header{justify-content:space-between;margin-bottom:18px}h1{font-size:clamp(23px,3vw,35px);letter-spacing:.02em;margin:0}h2,h3{font-size:16px;margin:0}.bar{justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--line)}p{color:var(--soft);font-size:13px;line-height:1.65;margin:7px 0}a{color:var(--mint)}button,select,.tab{font:inherit;font-size:14px;line-height:1.25;color:#e6eff2;background:#26363b;border:1px solid #40565c;border-radius:7px;padding:8px 11px;cursor:pointer}.tab{text-decoration:none}.tab[aria-current=page],.primary{background:var(--mint);color:#142b25;border-color:var(--mint);font-weight:700}select{max-width:100%}button:hover,.tab:hover,select:hover{border-color:var(--mint)}:focus-visible{outline:2px solid var(--mint);outline-offset:2px}label{font-size:13px;color:var(--soft)}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.panel{min-width:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#152125}.media{display:grid;place-items:center;background:#080d0e;width:100%;aspect-ratio:16/9}.media>canvas,.media>video{display:block;width:100%;height:100%;min-height:0;object-fit:contain}.bar time,#clock{font:13px ui-monospace,monospace;white-space:nowrap;color:var(--mint)}.foot{min-height:49px;padding:8px 13px;margin:0}.transport{margin-top:13px}.scrub{flex:1;min-width:160px;accent-color:var(--mint)}.stamps{margin-top:10px}.stamps button{font-size:12px}.source{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.cards{align-items:flex-start;gap:9px;margin:10px 0}.cards a{max-width:160px;width:clamp(116px,15%,160px);font-size:12px;text-decoration:none;color:#dce9e9}.cards img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#090d0f;border:1px solid var(--line);border-radius:4px;margin-bottom:4px}.cardtime{display:block;color:var(--mint);font:12px ui-monospace,monospace}.source a+a{margin-left:14px}#gallery a+a{margin:0}.err{color:#ffca9e}.mesh-controls{display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;padding:9px 13px;border-top:1px solid var(--line)}.mesh-controls label{display:flex;align-items:center;gap:5px}.mesh-controls input[type=range]{width:86px;accent-color:var(--mint)}.mesh-controls output{width:36px;text-align:right;font-variant-numeric:tabular-nums}.tools{margin-bottom:10px;display:flex;gap:16px;flex-wrap:wrap}.tools select{margin-left:5px}.tools label{line-height:2}button:disabled{opacity:.5}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:740px){.pair{grid-template-columns:1fr}.foot{min-height:0}.bar{padding:7px 10px}header{margin-bottom:12px}.transport{gap:6px}.scrub{order:10;flex-basis:100%}}
</style>
<style>html.embedded header,html.embedded #tabspirit,html.embedded #tabkame{display:none}html.embedded main{padding:12px}</style><script>if(new URLSearchParams(location.search).has('embedded'))document.documentElement.classList.add('embedded');</script>
</head>
<body><main>
<header><h1 id="title">龙珠特效对照</h1><nav aria-label="特效"><a class="tab" id="tabspirit" href="?fx=spirit">元气弹</a><a class="tab" id="tabkame" href="?fx=kame">龟派气功</a></nav></header>
<div class="tools"><label id="studyCameraLabel" hidden>左侧机位 <select id="studyCamera"><option value="reference">按原片构图</option><option value="side">透视侧视</option><option value="demo">作者 Demo 相机参数</option></select></label><label id="sourceLabel">右侧参考<select id="sources"></select></label><label id="alignmentLabel" hidden>时间轴<select id="alignment"><option value="phases">按招式阶段对齐</option><option value="native">两侧各自原速</option></select></label></div>
<div class="pair">
  <section class="panel"><div class="bar"><h2 id="newTitle">新版 · 整体擂台</h2><time id="newTime"></time></div><div class="media"><canvas id="arena" width="960" height="400" aria-label="新版完整擂台"></canvas></div><p class="foot" id="newNote"></p></section>
  <section class="panel"><div class="bar"><h2 id="refTitle">参考</h2><time id="refTime"></time></div><div class="media"><canvas id="meshView" width="960" height="400" aria-label="同一束光的三维检查" hidden></canvas><video id="film" muted playsinline preload="auto" aria-label="原片全幅"></video><img id="still" hidden style="width:100%;height:100%;object-fit:contain" alt="用户提供的爆发全幅原图"></div><p class="foot" id="refNote"></p><div class="mesh-controls" id="meshControls" hidden>
   <label>水平环绕 <input type="range" id="meshYaw" min="-70" max="70" step="1" value="0"><output id="meshYawRead">0°</output></label>
   <label>上下环绕 <input type="range" id="meshPitch" min="-45" max="45" step="1" value="0"><output id="meshPitchRead">0°</output></label>
   <label><input type="checkbox" id="meshWire">线框</label>
   <button id="meshReset" type="button">还原侧视</button>
   <button id="meshAngled" type="button">斜视检查</button>
  </div></section>
</div>
<div class="transport"><button class="primary" id="play" type="button">播放</button><button id="replay" type="button">重播</button><button id="back" type="button" aria-label="上一帧">上一帧</button><button id="forth" type="button" aria-label="下一帧">下一帧</button><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label><label for="scrub" class="sr">共同播放时间</label><input class="scrub" id="scrub" type="range" min="0" max="5" step=".001" value="0"><output id="clock"></output></div>
<div class="stamps" id="phases" aria-label="跳至阶段"></div><p id="notice" class="err" role="status"></p>
<section class="source"><h3 id="galleryTitle">此次采用的原片全幅选帧</h3><div class="cards" id="gallery"></div><p id="links"></p></section>
</main>
<style>[hidden]{display:none!important}</style>
<script src="dragon-vfx/data.js"></script><script src="dragon-vfx/spirit-volume.js"></script><script src="dragon-vfx/spirit-ejecta.js"></script><script src="dragon-vfx/spirit-impact-3d.js"></script><script src="dragon-vfx/spirit.js"></script><script src="dragon-vfx/kame-volume.js"></script><script src="dragon-vfx/kame-study-effects.js"></script><script src="dragon-vfx/kame-source-meshes.js"></script><script src="dragon-vfx/kame-study.js"></script><script src="dragon-vfx/kame.js"></script><script src="dragon-vfx/arena-stage.js"></script><script src="dragon-vfx/kame-arena.js"></script><script src="dragon-vfx/player.js"></script>
</body></html>
