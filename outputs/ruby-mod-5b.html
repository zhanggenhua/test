const controls = {};
for (const id of ['stage', 'play', 'previous', 'next', 'timing', 'speed', 'loop', 'seek', 'status']) {
  controls[id] = document.getElementById(id);
}
const images = data.images.map(url => { const image = new Image(); image.src = url; return image; });
let frame = 0;
let animation = null;

function show(index) {
  frame = Math.max(0, Math.min(images.length - 1, index));
  const row = data[controls.timing.value][frame];
  controls.stage.src = images[frame].src;
  controls.seek.value = frame;
  controls.status.textContent = `${frame + 1} / ${images.length} · ${row.start_ms} ms`;
}

function pause() {
  cancelAnimationFrame(animation);
  animation = null;
  controls.play.textContent = '播放';
}

controls.play.onclick = () => {
  if (animation !== null) { pause(); return; }
  if (frame === images.length - 1) show(0);
  const rows = data[controls.timing.value];
  const speed = Number(controls.speed.value);
  const origin = performance.now() - rows[frame].start_ms / speed;
  const last = rows.at(-1);
  const end = last.start_ms + last.duration_ms;
  controls.play.textContent = '暂停';
  function update(now) {
    const total = (now - origin) * speed;
    const elapsed = controls.loop.checked ? total % (end + 300) : total;
    const current = rows.findLastIndex(row => row.start_ms <= elapsed);
    if (current !== frame) show(current);
    if (!controls.loop.checked && elapsed >= end) pause();
    else animation = requestAnimationFrame(update);
  }
  animation = requestAnimationFrame(update);
};
controls.previous.onclick = () => { pause(); show(frame - 1); };
controls.next.onclick = () => { pause(); show(frame + 1); };
controls.seek.oninput = () => { pause(); show(Number(controls.seek.value)); };
controls.timing.onchange = () => { pause(); show(frame); };
controls.speed.onchange = pause;
show(0);
</script>
