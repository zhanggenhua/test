<div id="kame-vfx-studio">
  <h1>龟波气功特效台</h1>
  <div class="nav nav-pills" role="tablist" aria-label="特效工作台">
    <button class="nav-link active" id="kame-compare-tab" role="tab" aria-controls="kame-compare" aria-selected="true" type="button">同步对比</button>
    <button class="nav-link" id="kame-library-tab" role="tab" aria-controls="kame-library" aria-selected="false" type="button">素材逐帧</button>
  </div>
  <p data-key="error" role="alert" class="text-destructive" hidden>素材加载失败，请重新打开对比页。</p>
  <section id="kame-compare" role="tabpanel" aria-labelledby="kame-compare-tab">
    <div class="kame-pair">
      <div>
        <label class="form-label" for="kame-left">左侧版本</label>
        <select class="form-select" id="kame-left" data-key="left">
          <option>V4 原版</option><option>手绘初稿</option><option>CC0 适配版</option><option>pixelfx 制作版</option><option>pixelfx 样例</option>
        </select>
        <canvas class="kame-stage" width="640" height="180" data-key="leftCanvas" role="img" aria-label="左侧特效预览"></canvas>
      </div>
      <div>
        <label class="form-label" for="kame-right">右侧版本</label>
        <select class="form-select" id="kame-right" data-key="right">
          <option>V4 原版</option><option>手绘初稿</option><option>CC0 适配版</option><option selected>pixelfx 制作版</option><option>pixelfx 样例</option>
        </select>
        <canvas class="kame-stage" width="640" height="180" data-key="rightCanvas" role="img" aria-label="右侧特效预览"></canvas>
      </div>
    </div>
    <p class="text-small text-muted" data-key="referenceNote" hidden>pixelfx 样例按掌心与起射点对位，保留原有末端爆闪。</p>
    <div class="kame-timeline">
      <div class="kame-between">
        <label class="form-label" for="kame-time">动作时间 <output class="tabular-nums" data-key="timeLabel">380 / 780 ms</output></label>
        <output data-key="phase" class="text-small text-muted">持续光束</output>
      </div>
      <input class="form-range" id="kame-time" data-key="time" type="range" min="0" max="780" value="380">
      <div class="viz-row">
        <button type="button" class="btn btn-primary" data-key="play">从头播放</button>
        <button type="button" class="btn" data-key="prior">上一帧</button>
        <button type="button" class="btn" data-key="next">下一帧</button>
        <label class="form-label" for="kame-speed">速度</label>
        <select class="form-select kame-short" id="kame-speed" data-key="speed">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
        </select>
        <label class="form-check"><input data-key="only" type="checkbox" class="form-check-input"><span class="form-check-label">仅特效</span></label>
      </div>
      <div class="viz-row" aria-label="关键时刻">
        <button class="btn btn-ghost" type="button" data-jump="70">聚气</button>
        <button class="btn btn-ghost" type="button" data-jump="230">出波</button>
        <button class="btn btn-ghost" type="button" data-jump="380">持续</button>
        <button class="btn btn-ghost" type="button" data-jump="560">收束</button>
      </div>
    </div>
  </section>
  <section id="kame-library" role="tabpanel" aria-labelledby="kame-library-tab" hidden>
    <label for="kame-track" class="form-label">素材片段</label>
    <select id="kame-track" data-key="track" class="form-select"></select>
    <canvas class="kame-stage kame-asset" data-key="assetCanvas" width="960" height="270" role="img" aria-label="选中素材的透明帧"></canvas>
    <div class="kame-between">
      <span class="text-small text-muted" data-key="assetInfo"></span>
      <a data-key="source" rel="noopener" target="_blank" hidden>素材来源</a>
    </div>
    <label class="form-label" for="kame-cell">素材帧 <output class="tabular-nums" data-key="frameLabel"></output></label>
    <input id="kame-cell" class="form-range" data-key="cell" type="range" min="0" max="7" value="0" step="1">
    <div class="viz-row">
      <button type="button" class="btn btn-primary" data-key="assetPlay">播放素材</button>
      <button type="button" class="btn" data-key="assetPrior">上一帧</button>
      <button type="button" class="btn" data-key="assetNext">下一帧</button>
      <label class="form-check"><input type="checkbox" class="form-check-input" data-key="pivot"><span class="form-check-label">显示挂点</span></label>
    </div>
  </section>
</div>
<style>
  #kame-vfx-studio { display:grid; gap:.72em; min-width:0; }
  #kame-vfx-studio [hidden] { display:none!important; }
  #kame-vfx-studio section { display:grid; gap:.68em; min-width:0; }
  #kame-vfx-studio .kame-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.8em; }
  #kame-vfx-studio .kame-pair > div { display:grid; gap:.34em; min-width:0; }
  #kame-vfx-studio .kame-between { display:flex; align-items:center; flex-wrap:wrap; gap:.6em; justify-content:space-between; }
  #kame-vfx-studio .kame-timeline { display:grid; gap:.38em; }
  #kame-vfx-studio .kame-stage {
    display:block; width:100%; height:auto;
    background:color-mix(in srgb,var(--foreground) 33%,var(--background));
  }
  #kame-vfx-studio .kame-asset {
    --kame-cell:color-mix(in srgb,var(--foreground) 38%,var(--background));
    background-image:conic-gradient(var(--kame-cell) 25%,transparent 0 50%,var(--kame-cell) 0 75%,transparent 0);
    background-size:22px 22px;
  }
  #kame-vfx-studio .kame-short { width:auto; }
  @media(max-width:510px) {
    #kame-vfx-studio .kame-pair { grid-template-columns:minmax(0,1fr); }
    #kame-vfx-studio .kame-asset { min-height:110px; object-fit:contain; }
  }
</style>

<script>
(() => {
  const root = document.getElementById("kame-vfx-studio");
  const ui = Object.fromEntries(Array.from(root.querySelectorAll("[data-key]"), el => [el.dataset.key, el]));
  const data = JSON.parse(document.getElementById("kame-atlas-data").textContent);
  const sprites = new Image();
  const compare = { t:380, playing:false, sample:true, last:0 };
  const asset = { t:0, playing:false, last:0 };
  const library = new Map();
  const palms = { "normal-charge":[155,252], "normal-drive":[304,219], "normal-fire":[313,209] };
  const milestones = [[0,"准备"],[70,"蓄力"],[190,"推掌"],[230,"光束展开"],[330,"持续光束"],[500,"收束"],[680,"结束"]];
  let loaded = false, frameRequest = 0, lastPainted = -1;

  function registerGroup(label, tracks) {
    const group = document.createElement("optgroup");
    group.label = label;
    for (const [key, value] of Object.entries(tracks)) {
      const id = label + "/" + key;
      library.set(id,value);
      group.append(new Option(value.label,id));
    }
    ui.track.add(group);
  }
  for (const [group, tracks] of Object.entries(data.groups)) registerGroup(group,tracks);
  registerGroup("上游素材与样例",data.refs);
  ui.track.value = "pixelfx 制作版/BeamHold";

  function commit() {
    const modelContent = { left:ui.left.value, right:ui.right.value, time_ms:Math.floor(compare.t),
      material:ui.track.value, asset_frame:activeFrame(activeTrack(),asset.t).index+1 };
    window.openai?.setWidgetState?.({ modelContent, privateContent:{ only:ui.only.checked, speed:ui.speed.value } })?.catch?.(() => {});
  }
  function restore(saved) {
    const m = saved?.modelContent;
    if (!m) return;
    if (Array.from(ui.left.options).some(o => o.value === m.left)) ui.left.value=m.left;
    if (Array.from(ui.right.options).some(o => o.value === m.right)) ui.right.value=m.right;
    if (Number.isFinite(m.time_ms)) compare.t=Math.min(data.total,Math.max(0,m.time_ms));
    compare.sample = false;
    if (library.has(m.material)) ui.track.value=m.material;
    const t=activeTrack();
    const index=Math.min(t.frames.length-1,Math.max(0,(Number(m.asset_frame)||1)-1));
    asset.t=t.ms.slice(0,index).reduce((a,b) => a+b,0);
    if (typeof saved.privateContent?.only === "boolean") ui.only.checked=saved.privateContent.only;
    if (["0.25","0.5","1"].includes(saved.privateContent?.speed)) ui.speed.value=saved.privateContent.speed;
    drawCompare();
    drawAsset();
  }
  function drawCel(ctx,id,x,y,zoom=1) {
    if (id < 0 || !loaded) return;
    const cell=data.atlas.cells[id];
    const [sx,sy,w,h,ox,oy]=cell;
    ctx.drawImage(sprites,sx,sy,w,h,x+ox*zoom,y+oy*zoom,w*zoom,h*zoom);
  }
  function duration(track) { return track.ms.reduce((a,b) => a+b,0); }
  function activeFrame(track,time) {
    const total=duration(track);
    let elapsed=track.loop && time < total ? time : Math.min(time,total-0.001);
    for (let i=0;i<track.ms.length;i++) {
      if (elapsed<track.ms[i]) return { index:i, id:track.frames[i] };
      elapsed-=track.ms[i];
    }
    return { index:track.frames.length-1,id:track.frames.at(-1) };
  }
  function oldFrame(t) {
    return data.base.findLast(f => f.time_ms<=t) ?? data.base[0];
  }
  function part(ctx,track,elapsed,palm,zoom=1) {
    if (elapsed<0) return;
    const total=duration(track);
    if (!track.loop && elapsed>=total) return;
    const frame=activeFrame(track,track.loop ? elapsed%total : elapsed);
    drawCel(ctx,frame.id,palm[0]/2-track.pivot[0]*zoom,palm[1]/2-track.pivot[1]*zoom,zoom);
  }
  function effect(ctx,version,t,body) {
    if (version === "V4 原版") {
      drawCel(ctx,data.old[body.effect],0,0);
      return;
    }
    if (version === "pixelfx 样例") {
      if (t>=70 && t<230) part(ctx,data.refs["spell-charge"],t-70,palms[body.body],1.84);
      if (t>=230 && t<680) part(ctx,data.refs["arcane-beam"],t-230,palms["normal-fire"],3.6);
      return;
    }
    const parts=data.groups[version];
    if (t>=70 && t<190) part(ctx,parts.ChargeIn,t-70,palms["normal-charge"]);
    if (t>=190 && t<230) part(ctx,parts.ChargeHold,t-190,palms["normal-drive"]);
    if (t>=230 && t<680) {
      const stage=t<330 ? ["BeamIn",230] : t<500 ? ["BeamHold",330] : ["BeamOut",500];
      part(ctx,parts[stage[0]],t-stage[1],palms["normal-fire"]);
      part(ctx,parts.Muzzle,t-230,palms["normal-fire"]);
    }
  }
  function comparePanel(canvas,version,t,body) {
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (!ui.only.checked) drawCel(ctx,data.body[body.body],0,0);
    effect(ctx,version,t,body);
  }
  function drawCompare() {
    const t=Math.min(Math.floor(compare.t),data.total);
    const frame=oldFrame(t);
    comparePanel(ui.leftCanvas,ui.left.value,t,frame);
    comparePanel(ui.rightCanvas,ui.right.value,t,frame);
    ui.referenceNote.hidden=ui.left.value!=="pixelfx 样例" && ui.right.value!=="pixelfx 样例";
    ui.time.value=t;
    ui.timeLabel.value=t+" / "+data.total+" ms";
    ui.phase.value=milestones.findLast(([start])=> t>=start)[1];
    ui.play.textContent=compare.playing ? "暂停" : compare.sample ? "从头播放" : t>=data.total ? "重播" : "播放";
  }
  function activeTrack() { return library.get(ui.track.value); }
  function drawAsset() {
    const t=activeTrack();
    const frame=activeFrame(t,asset.t);
    const canvas=ui.assetCanvas;
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const zoom=Math.min((canvas.width-48)/t.size[0],(canvas.height-24)/t.size[1]);
    const point=[(canvas.width-t.size[0]*zoom)/2,(canvas.height-t.size[1]*zoom)/2];
    ctx.imageSmoothingEnabled = true;
    drawCel(ctx,frame.id,point[0],point[1],zoom);
    if (ui.pivot.checked) {
      const [x,y]=point.map((n,i)=>n+t.pivot[i]*zoom);
      const styles=getComputedStyle(root);
      ctx.strokeStyle=styles.getPropertyValue("--foreground").trim() || styles.color;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);
      ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);
      ctx.stroke();
    }
    ui.cell.max=t.frames.length-1;
    ui.cell.value=frame.index;
    ui.frameLabel.value=(frame.index+1)+" / "+t.frames.length;
    ui.assetInfo.textContent=[t.credit,t.frames.length+" 帧",duration(t)+" ms",t.loop?"循环":"单次"].filter(Boolean).join(" · ");
    ui.source.hidden=!t.link;
    if (t.link) ui.source.href=t.link; else ui.source.removeAttribute("href");
    ui.assetPlay.textContent=asset.playing?"暂停素材":asset.t>=duration(t)?"重播素材":"播放素材";
  }
  function pauseAll() { compare.playing=false; asset.playing=false; }
  function tick(now) {
    frameRequest=0;
    if (compare.playing) {
      if (compare.last) compare.t=Math.min(data.total,compare.t+(now-compare.last)*Number(ui.speed.value));
      compare.last=now;
      if (Math.floor(compare.t)!==lastPainted) { lastPainted=Math.floor(compare.t); drawCompare(); }
      if (compare.t>=data.total) { compare.playing=false; drawCompare(); commit(); }
    }
    if (asset.playing) {
      const track=activeTrack();
      const end=duration(track);
      if (asset.last) asset.t+=now-asset.last;
      asset.last=now;
      if (track.loop) asset.t%=end;
      else if (asset.t>=end) { asset.t=end; asset.playing=false; commit(); }
      drawAsset();
    }
    if (compare.playing || asset.playing) schedule();
  }
  function schedule() {
    if (!frameRequest) frameRequest=requestAnimationFrame(tick);
  }
  function seek(value, save=true) {
    compare.sample=false;
    compare.playing=false;
    compare.t=Math.min(data.total,Math.max(0,value));
    drawCompare();
    if (save) commit();
  }
  function cutsIn(parts) {
    const times=[];
    for (const [name,start,end] of [["ChargeIn",70,190],["ChargeHold",190,230],["Muzzle",230,364],
      ["BeamIn",230,330],["BeamHold",330,500],["BeamOut",500,680]]) {
      const clip=parts[name];
      let t=start, i=0;
      while (t<end) { times.push(t); t+=clip.ms[i%clip.ms.length]; i++; }
    }
    return times;
  }
  function compareStep(direction) {
    const steps=[0,data.total,...data.base.map(f=>f.time_ms)];
    for (const choice of [ui.left.value,ui.right.value]) {
      if (data.groups[choice]) steps.push(...cutsIn(data.groups[choice]));
      if (choice==="pixelfx 样例") {
        for (const [name,start,end] of [["spell-charge",70,230],["arcane-beam",230,680]]) {
          let t=start;
          for (const ms of data.refs[name].ms) {
            if (t>=end) break;
            steps.push(t);
            t+=ms;
          }
        }
      }
    }
    const sorted=[...new Set(steps)].sort((a,b)=>a-b);
    seek(direction>0 ? (sorted.find(t=>t>compare.t)??data.total) : (sorted.findLast(t=>t<compare.t)??0));
  }
  function setAsset(index, save=true) {
    const track=activeTrack();
    index=Math.min(track.frames.length-1,Math.max(0,index));
    asset.playing=false;
    asset.t=track.ms.slice(0,index).reduce((a,b)=>a+b,0);
    drawAsset();
    if (save) commit();
  }
  ui.time.addEventListener("input",()=>seek(Number(ui.time.value),false));
  ui.time.addEventListener("change",commit);
  ui.prior.addEventListener("click",()=>compareStep(-1));
  ui.next.addEventListener("click",()=>compareStep(1));
  for (const button of root.querySelectorAll("[data-jump]")) button.addEventListener("click",()=>seek(Number(button.dataset.jump)));
  for (const el of [ui.left,ui.right,ui.only,ui.speed]) el.addEventListener("change",()=>{ drawCompare(); commit(); });
  ui.play.addEventListener("click",()=>{
    const was=compare.playing;
    pauseAll();
    if (!was) {
      if (compare.sample || compare.t>=data.total) compare.t=0;
      compare.sample=false;
      compare.last=0;
      compare.playing=true;
      schedule();
    } else commit();
    drawCompare();
  });
  ui.track.addEventListener("change",()=>setAsset(0));
  ui.cell.addEventListener("input",()=>setAsset(Number(ui.cell.value),false));
  ui.cell.addEventListener("change",commit);
  ui.assetPrior.addEventListener("click",()=>setAsset(activeFrame(activeTrack(),asset.t).index-1));
  ui.assetNext.addEventListener("click",()=>setAsset(activeFrame(activeTrack(),asset.t).index+1));
  ui.pivot.addEventListener("change",drawAsset);
  ui.assetPlay.addEventListener("click",()=>{
    const was=asset.playing;
    pauseAll();
    if (!was) {
      if (asset.t>=duration(activeTrack())) asset.t=0;
      asset.last=0;
      asset.playing=true;
      schedule();
    } else commit();
    drawAsset();
  });
  for (const tab of root.querySelectorAll("[role=tab]")) tab.addEventListener("click",()=>{
    pauseAll();
    drawCompare();
    drawAsset();
  });
  window.addEventListener("openai:set_globals", e=>restore(e.detail?.globals?.widgetState));
  sprites.onload=()=>{ loaded=true;drawCompare();drawAsset(); };
  sprites.onerror=()=>{ ui.error.hidden=false; };
  sprites.src=data.atlas.src;
  restore(window.openai?.widgetState);
  drawCompare();
  drawAsset();
})();
</script>
